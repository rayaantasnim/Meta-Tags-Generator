<!doctype html>
<html lang="en" class="dark h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Core Meta Tags -->
    <title>Deploy-Free Protocol | Classified Access Security Gateway</title>
    <meta
      name="description"
      content="Access Control Dashboard for Deploy-Free. Acknowledge framework integrity directives, enter verified developer credentials, and bypass corporate server constraints to unlock the core generation matrix."
    />
    <meta name="author" content="Rayaan Tasnim" />
    <meta
      name="keywords"
      content="Meta Tag Generator, Open Graph Compiler, Twitter Card Creator, SEO Optimization Tool, Subfolder CSS Validator, Automated Meta Code, 5s Matrix Loader, Quota Limit Reset, Abort Protocol, Alphanumeric Validation"
    />

    <!-- Open Graph Protocols (Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Deploy-Free Protocol | Secure Access Authorization Gate"
    />
    <meta
      property="og:description"
      content="Acknowledge full compliance with Deploy-Free protocols to safely initialize the automated metadata and frontend boilerplate compiler."
    />
    <meta property="og:image" content="https://github.io" />
    <meta property="og:url" content="https://github.io" />

    <!-- Twitter / X Card Data -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Deploy-Free Protocol | Open Source Access Portal"
    />
    <meta
      name="twitter:description"
      content="Enter your credentials and certify to uphold the framework integrity to proceed to the core automated optimization terminal."
    />
    <meta name="twitter:image" content="https://github.io" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/design.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/form.css" />

    <!-- GSAP & ScrollTrigger CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  </head>
  <body
    class="h-full flex flex-col justify-between relative selection:bg-cyber-neon selection:text-black min-h-screen"
  >
    <!-- Ambient Glowing Background Elements -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
      <div
        id="glow-1"
        class="absolute -top-40 -left-40 w-96 h-96 rounded-full bg-cyber-purple opacity-30 blur-[120px]"
      ></div>
      <div
        id="glow-2"
        class="absolute top-1/2 -right-40 w-96 h-96 rounded-full bg-cyber-neon opacity-20 blur-[140px]"
      ></div>
      <div
        id="glow-3"
        class="absolute -bottom-40 left-1/3 w-96 h-96 rounded-full bg-cyber-pink opacity-25 blur-[130px]"
      ></div>
    </div>

    <!-- Main Content Container -->
    <main
      class="relative z-10 flex-grow flex items-center justify-center p-4 sm:p-6 md:p-8"
    >
      <!-- Registration Form -->
      <div
        id="nda-card"
        class="w-full max-w-xl glass-panel rounded-2xl p-6 sm:p-8 shadow-glow border border-white/10 relative overflow-hidden"
      >
        <!-- Header -->
        <div class="text-center mb-8 form-element">
          <div
            class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyber-neon text-xs font-semibold tracking-wider uppercase mb-3"
          >
            <span
              class="w-2 h-2 rounded-full bg-cyber-neon animate-pulse"
            ></span>
            Classified Access
          </div>
          <h1
            class="text-3xl sm:text-4xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500"
          >
            META TAGS GENERATOR
          </h1>
          <p class="text-slate-400 text-sm mt-2">
            Enter credentials and acknowledge security directive.
          </p>
        </div>

        <!-- Form -->
        <form id="nda-form" class="space-y-5" onsubmit="return false;">
          <!-- Full Name Input -->
          <div class="form-element">
            <label
              for="user-name"
              class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2"
              >Full Name</label
            >
            <div class="neon-border rounded-lg">
              <input
                type="text"
                id="user-name"
                autocomplete="off"
                placeholder="John Doe"
                class="w-full px-4 py-3 bg-slate-950/70 text-slate-100 rounded-lg outline-none border border-slate-700/60 focus:border-cyber-neon transition-all duration-300 placeholder-slate-600"
              />
            </div>
            <p id="name-error" class="text-xs text-red-400 mt-1 hidden">
              Name is required.
            </p>
          </div>

          <!-- Age & Email Grid -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
            <!-- Age Input -->
            <div class="form-element sm:col-span-1">
              <label
                for="user-age"
                class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2"
                >Age</label
              >
              <div class="neon-border rounded-lg">
                <input
                  type="number"
                  id="user-age"
                  min="1"
                  max="120"
                  placeholder="Age"
                  class="w-full px-4 py-3 bg-slate-950/70 text-slate-100 rounded-lg outline-none border border-slate-700/60 focus:border-cyber-neon transition-all duration-300 placeholder-slate-600"
                />
              </div>
              <p id="age-error" class="text-xs text-red-400 mt-1 hidden">
                Valid age required.
              </p>
            </div>

            <!-- Email Input -->
            <div class="form-element sm:col-span-2">
              <label
                for="user-email"
                class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2"
                >Email Address</label
              >
              <div class="neon-border rounded-lg">
                <input
                  type="email"
                  id="user-email"
                  placeholder="agent@aegis.corp"
                  class="w-full px-4 py-3 bg-slate-950/70 text-slate-100 rounded-lg outline-none border border-slate-700/60 focus:border-cyber-neon transition-all duration-300 placeholder-slate-600"
                />
              </div>
              <p id="email-error" class="text-xs text-red-400 mt-1 hidden">
                Valid email format required.
              </p>
            </div>
          </div>

          <!-- NDA Agreement Checkbox -->
          <div class="form-element pt-2">
            <label class="flex items-start gap-3 cursor-pointer group">
              <input
                type="checkbox"
                id="nda-checkbox"
                class="cyber-checkbox mt-0.5 shrink-0"
              />
              <span
                class="text-xs text-slate-300 leading-relaxed group-hover:text-slate-100 transition-colors"
              >
                I corporate full compliance with the Deploy-Free protocols. I
                certify to uphold the integrity of this framework and accept
                full responsibility for the generated production assets.
              </span>
            </label>
          </div>

          <!-- Submit Button -->
          <div class="form-element pt-4">
            <button
              type="button"
              id="btn-submit-nda"
              disabled
              class="w-full py-3.5 px-6 rounded-lg font-bold text-sm tracking-wider uppercase transition-all duration-300 text-slate-400 bg-slate-800/60 border border-slate-700 cursor-not-allowed"
            >
              Submit & Proceed
            </button>
          </div>
        </form>
      </div>
    </main>

    <!-- Footer -->
    <footer
      class="relative z-10 py-6 text-center border-t border-slate-800/80 bg-slate-950/60 backdrop-blur-md"
    >
      <p class="text-xs text-slate-400 font-medium tracking-wide">
        Authorized by
        <span class="text-cyber-neon font-semibold">Rayaan Tasnim</span> with
        precision
      </p>
      <p class="text-[11px] text-slate-500 mt-1 font-mono">
        Powered by
        <span class="text-purple-400 font-semibold">IDAI Universe</span> &bull;
        All rights reserved
      </p>
    </footer>

    <!-- Modular Vanilla JavaScript -->
    <script src="js/form.js"></script>
  </body>
</html>
